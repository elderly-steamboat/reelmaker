name: build

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ---- Linux -------------------------------------------------------------------------------
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev ffmpeg patchelf pkg-config xz-utils \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: cargo test

      - name: Bundle (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build.sh

      # ---- macOS -------------------------------------------------------------------------------
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install mpv ffmpeg dylibbundler

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: |
          export LIBRARY_PATH="$(brew --prefix mpv)/lib"
          export RUSTFLAGS="-L $(brew --prefix mpv)/lib"
          cargo test

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/build.sh

      # ---- Windows -----------------------------------------------------------------------------
      # build.ps1 fetches libmpv + ffmpeg into vendor\, builds the release bundle and smoke-tests it.
      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MPV_LIB_DIR: ${{ github.workspace }}\vendor\mpv-dev
        run: |
          $env:Path += ";${{ github.workspace }}\vendor\ffmpeg"
          cargo test

      - uses: actions/upload-artifact@v4
        with:
          name: reelmaker-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
